<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reset Password — Athenaeum</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="css/style.css?v=20261020-3">
</head>
<body data-theme="light">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo"><span class="logo-mark"></span> Athenaeum</a>
    <div class="nav-actions" style="margin-left:auto;">
      <button class="icon-btn theme-toggle"><span class="theme-toggle-icon"></span></button>
      <a href="login.html" class="btn btn-secondary btn-sm">Back to Log In</a>
    </div>
  </div>
</header>

<main class="auth-shell" style="grid-template-columns:1fr;">
  <div class="auth-form-side">
    <div class="auth-card">
      <h1>Reset your password</h1>
      <div class="sub">Enter the email on your account and we'll send a reset link.</div>

      <div class="form-banner" id="formBanner"></div>

      <form id="forgotForm" novalidate>
        <div class="field">
          <label>Email address</label>
          <input type="email" id="forgotEmail" placeholder="you@university.edu" required>
        </div>
        <button class="btn btn-primary btn-block" type="submit">Send Reset Link</button>
      </form>

      <div class="auth-foot">Remembered it? <a href="login.html">Log in instead</a></div>
    </div>
  </div>
</main>

<script src="js/icons.js"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/auth.js"></script>
<script src="js/supabase-auth.js?v=2"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/forgot-password.js"></script>
</body>
</html>
