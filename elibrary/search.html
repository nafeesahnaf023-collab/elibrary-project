<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search & Filter — Athenaeum</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📚</text></svg>">
<link rel="stylesheet" href="css/style.css?v=20261020-3">
</head>
<body data-theme="light" class="has-bottom-nav">

<header class="navbar">
  <div class="container navbar-inner">
    <a href="index.html" class="logo"><span class="logo-mark"></span> Athenaeum</a>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="search.html" class="active">Categories</a>
      <a href="search.html?sort=trending">Trending</a>
      <a href="my-books.html">My Books</a>
    </nav>
    <div class="nav-search">
      <span></span>
      <input id="navSearchInput" type="text" placeholder="Search books, authors, universities...">
      <div class="search-suggest" id="navSuggest"></div>
    </div>
    <div class="nav-actions">
      <button class="icon-btn theme-toggle"><span class="theme-toggle-icon"></span></button>
      <div style="position:relative;">
        <button class="icon-btn" id="notifBtn"><span class="notif-dot" id="notifDot" style="display:none"></span><span></span></button>
        <div class="dropdown-panel" id="notifPanel"><div class="dropdown-head">Notifications</div><div class="dropdown-list" id="notifList"></div></div>
      </div>
      <div id="navAuthArea" style="position:relative;"></div>
      <button class="icon-btn mobile-toggle"><span></span></button>
    </div>
  </div>
</header>

<main class="container" style="padding-top:36px; padding-bottom:60px;">
  <div class="page-head">
    <div>
      <h2>Advanced Search & Filter</h2>
      <div class="sub">Narrow results by university, department, semester and more</div>
    </div>
  </div>

  <div class="search-layout">
    <aside class="filter-panel" id="filterPanel">
      <div class="field" style="margin-bottom:0;">
        <input type="text" id="mainSearchInput" placeholder="Search by title, author, keyword...">
      </div>
      <button type="button" class="btn btn-secondary btn-block filter-toggle" id="filterToggle" aria-expanded="false" aria-controls="filterBody">Filters</button>
      <div class="filter-body" id="filterBody">

      <div class="filter-group">
        <h5>University</h5>
        <select id="fUniversity">
          <option value="">All universities</option>
        </select>
      </div>

      <div class="filter-group">
        <h5>Department</h5>
        <div id="fDepartment"></div>
      </div>

      <div class="filter-group">
        <h5>Semester</h5>
        <select id="fSemester">
          <option value="">Any semester</option>
          <option>1st–2nd</option>
          <option>3rd–4th</option>
          <option>5th–6th</option>
          <option>7th–8th</option>
        </select>
      </div>

      <div class="filter-group">
        <h5>Author</h5>
        <select id="fAuthor"><option value="">Any author</option></select>
      </div>

      <div class="filter-group">
        <h5>Publication Year</h5>
        <select id="fYear"><option value="">Any year</option></select>
      </div>

      <div class="filter-group">
        <h5>File Type</h5>
        <label class="check-row"><input type="checkbox" value="PDF" class="fFileType"> PDF</label>
        <label class="check-row"><input type="checkbox" value="EPUB" class="fFileType"> EPUB</label>
      </div>

      <div class="filter-group">
        <h5>Language</h5>
        <label class="check-row"><input type="checkbox" value="English" class="fLang"> English</label>
        <label class="check-row"><input type="checkbox" value="Bangla" class="fLang"> Bangla</label>
      </div>

      <div class="filter-group">
        <h5>Popular filters</h5>
        <div class="chip-row">
          <button class="tag-chip" data-quick="verified">Verified only</button>
          <button class="tag-chip" data-quick="highrated">4.5+ rating</button>
        </div>
      </div>

      <button class="btn btn-secondary btn-block" id="clearFilters" style="margin-top:14px;">Clear all filters</button>
      </div>
    </aside>

    <section>
      <div class="results-head">
        <div class="results-count" id="resultsCount">Loading…</div>
        <select class="sort-select" id="sortSelect">
          <option value="relevance">Sort: Relevance</option>
          <option value="downloads">Sort: Most downloaded</option>
          <option value="rating">Sort: Highest rated</option>
          <option value="newest">Sort: Newest</option>
        </select>
      </div>
      <div class="book-grid-3" id="resultsGrid"></div>

      <div class="section" style="padding-top:56px;">
        <div class="section-head"><h2 style="font-size:22px;">Trending Now</h2></div>
        <div class="book-grid" id="trendingGrid"></div>
      </div>
    </section>
  </div>
</main>

<nav class="bottom-nav">
  <a href="index.html" data-icon="home">Home</a>
  <a href="search.html" data-icon="search" class="active">Search</a>
  <a href="upload.html" data-icon="upload">Upload</a>
  <a href="my-books.html" data-icon="book">My Books</a>
  <a href="dashboard.html" data-icon="user">Profile</a>
</nav>

<script src="js/icons.js"></script>
<script src="js/department-icons.js"></script>
<script src="js/supabase.js"></script>
<script src="js/data.js"></script>
<script src="js/files.js"></script>
<script src="js/covers.js"></script>
<script src="js/auth.js"></script>
<script src="js/supabase-auth.js?v=2"></script>
<script src="js/components.js"></script>
<script src="js/main.js"></script>
<script src="js/search.js"></script>
</body>
</html>
